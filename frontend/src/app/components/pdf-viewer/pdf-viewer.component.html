<div class="relative h-full overflow-auto bg-gray-100 dark:bg-gray-900 rounded-lg">
  @if (loading) {
    <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-gray-100/90 dark:bg-gray-900/90 z-10 animate-fade-in">
      @if (progress.total > 0) {
        <div class="w-40 h-1 bg-gray-300 dark:bg-gray-700 rounded-full overflow-hidden">
          <div
            class="h-full bg-accent rounded-full transition-[width] duration-300 ease-out"
            [style.width.%]="(progress.rendered / progress.total) * 100"
          ></div>
        </div>
      }
      <div class="w-5 h-5 border-2 border-gray-300 dark:border-gray-700 border-t-accent rounded-full animate-spin"></div>
      <p class="text-sm text-muted">
        @if (progress.total > 0) {
          Rendering page {{ progress.rendered }} of {{ progress.total }}...
        } @else {
          Opening PDF...
        }
      </p>
    </div>
  }
  @if (error) {
    <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-center px-6 animate-fade-in">
      <p class="text-sm text-red-500 dark:text-red-400">{{ error }}</p>
      <button
        (click)="retry()"
        class="text-sm font-medium text-ink border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-1.5 transition-all duration-150 hover:bg-white dark:hover:bg-gray-800 bg-white/50 dark:bg-gray-800/50 active:scale-95"
      >
        Retry
      </button>
    </div>
  }
  <div
    #container
    class="py-4"
    (click)="documentClicked.emit()"
    (mousedown)="onContainerMouseDown($event)"
    (mousemove)="onContainerMouseMove($event)"
    (mouseup)="onContainerMouseUp($event)"
  ></div>

  @if (selectionToolbar; as toolbar) {
    <div
      class="absolute z-20 flex flex-col items-center -translate-x-1/2 animate-fade-in"
      [style.left.px]="toolbar.x"
      [style.top.px]="toolbar.y"
      [class.-translate-y-full]="toolbar.placement === 'above'"
      (mousedown)="$event.stopPropagation()"
    >
      <div
        class="flex items-stretch gap-0.5 bg-surface border border-line rounded-lg shadow-lg shadow-black/10 px-1 py-1"
        [class.order-1]="toolbar.placement === 'above'"
        [class.order-2]="toolbar.placement === 'below'"
      >
        <button
          (click)="onExplainClick()"
          class="flex items-center gap-1.5 text-xs font-medium text-ink rounded-md px-2.5 py-1.5 transition-colors duration-150 hover:bg-surface-alt"
        >
          <span aria-hidden="true">💡</span> Explain
        </button>
        <div class="w-px my-1 bg-line"></div>
        <button
          (click)="onSummarizeClick()"
          class="flex items-center gap-1.5 text-xs font-medium text-ink rounded-md px-2.5 py-1.5 transition-colors duration-150 hover:bg-surface-alt"
        >
          <span aria-hidden="true">🌐</span> Summarize
        </button>
      </div>
      <!-- Connector arrow, pointing at the anchor point - visually "attaches" the toolbar to the
           selection instead of it looking like an unrelated box floating over the content. -->
      <div
        class="w-2.5 h-2.5 shrink-0 bg-surface border-line"
        [class]="toolbar.placement === 'above'
          ? 'order-2 -mt-[5px] border-r border-b rotate-45'
          : 'order-1 -mb-[5px] border-l border-t rotate-45'"
      ></div>
    </div>
  }
</div>
