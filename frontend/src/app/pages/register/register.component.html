<div class="min-h-screen flex items-center justify-center bg-paper px-4 relative">
  <div class="absolute top-4 right-4">
    <app-theme-toggle />
  </div>

  <div class="w-full max-w-sm bg-surface border border-line rounded-xl p-8 shadow-sm animate-fade-in-up">
    <h1 class="text-xl font-semibold text-ink mb-1">Create account</h1>
    <p class="text-sm text-muted mb-6">AI Document Fact Checker</p>

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-ink mb-1">Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="w-full rounded-lg border border-line bg-surface text-ink px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[color:var(--color-focus-ring)] transition-shadow duration-150"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-ink mb-1">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          class="w-full rounded-lg border border-line bg-surface text-ink px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[color:var(--color-focus-ring)] transition-shadow duration-150"
        />
        <p class="text-xs text-muted mt-1">At least 8 characters.</p>
      </div>

      @if (error()) {
        <p class="text-sm text-red-600 dark:text-red-400 animate-fade-in-up">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-accent text-white rounded-lg py-2 text-sm font-medium disabled:opacity-50 transition-all duration-150 hover:bg-accent-hover active:scale-[0.98]"
      >
        {{ loading() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="text-sm text-muted mt-4">
      Already have an account? <a routerLink="/login" class="text-accent hover:text-accent-hover underline transition-colors duration-150">Sign in</a>
    </p>
  </div>
</div>
