server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: serve index.html for any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's hashed chunk filenames - it must never be cached,
    # or a returning browser keeps loading an old build's JS/CSS forever regardless of redeploys.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Chunk filenames are content-hashed by the Angular build, so a new deploy always gets a new
    # URL - safe to cache these as aggressively and permanently as possible.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /pdf.worker.min.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
