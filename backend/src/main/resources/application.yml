server:
  port: 8080

spring:
  application:
    name: ai-document-fact-checker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/factchecker}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:factchecker}
    password: ${DB_PASSWORD:factchecker}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # Hibernate 6 + Postgres gotcha: without this, a String field annotated @Lob maps to
        # Postgres's "oid" large-object type (needing special large-object handling) instead of a
        # plain "text" column. This forces the plain-text mapping, matching how it already worked
        # under H2 - no entity annotations need to change.
        jdbc:
          lob:
            non_contextual_creation: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

# Error tracking - the Sentry Spring Boot starter no-ops entirely when dsn is blank, so this is
# safe to leave as-is with no account: set SENTRY_DSN once you've created a (free) Sentry project.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

app:
  upload-dir: ./uploads
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-random-64-byte-secret-in-your-env}
    expiration-minutes: 720
  cors:
    allowed-origin: http://localhost:4200
  searxng:
    base-url: ${SEARXNG_BASE_URL:http://localhost:8888}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    # llama3.2:3b was faster but unreliable at structured output (e.g. markdown tables for
    # comparison questions) even with an explicit example in the prompt - confirmed via direct
    # side-by-side test that llama3.1:8b follows the same instruction correctly. Slower per
    # response, but already pulled (used as the eval suite's judge model) - no new download.
    chat-model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
    # Fallback for user-selected image regions (e.g. a diagram/chart) when OCR finds too little
    # text to work with - see ImageQueryService. ~4.7GB, already pulled locally.
    vision-model: ${OLLAMA_VISION_MODEL:llava}
  ocr:
    tessdata-path: ${TESSDATA_PATH:}
  rate-limit:
    # Requests allowed per minute, per user (or per IP if unauthenticated). In-memory and
    # per-instance - see RateLimitFilter before scaling to multiple backend instances.
    standard-capacity: ${RATE_LIMIT_STANDARD:30}
    auth-capacity: ${RATE_LIMIT_AUTH:10}

logging:
  level:
    com.factchecker: INFO
